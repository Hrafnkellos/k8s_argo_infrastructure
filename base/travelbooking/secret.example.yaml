# Not applied by Kustomize/Argo CD. Create the real secret once per cluster:
#
#   kubectl create namespace travelbooking
#   kubectl -n travelbooking create secret generic travelbooking-secrets \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=KEYCLOAK_ADMIN=admin \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: travelbooking-secrets
  namespace: travelbooking
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: change-me
