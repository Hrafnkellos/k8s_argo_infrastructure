apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: ["start", "--import-realm"]
          env:
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: travelbooking-config
                  key: PUBLIC_URL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelbooking-secrets
                  key: POSTGRES_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: travelbooking-secrets
                  key: KEYCLOAK_ADMIN
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelbooking-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: travelbooking
            - name: KC_DB_PASSWORD
              value: $(DB_PASSWORD)
            # Served behind Traefik at <PUBLIC_URL>/auth; TLS terminates at the ingress
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # Issuer is always the public URL; backchannel (JWKS) follows the
            # request, so the API can fetch keys via the in-cluster service.
            - name: KC_HOSTNAME
              value: $(PUBLIC_URL)/auth
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
